<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 466" role="img">
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2328"/></marker></defs>
<style>
.box{fill:#fff;stroke:#1f2328;stroke-width:1.2}
.store{fill:#fff;stroke:#0969da;stroke-width:1.6}
.lbl{fill:#1f2328;font:600 14px sans-serif}
.sub{fill:#57606a;font:13px sans-serif}
.arr{stroke:#1f2328;stroke-width:1.4;fill:none;marker-end:url(#head)}
</style>
<rect width="100%" height="100%" fill="#fff"/>

  <title>Assistant dialogue logic</title>
  <desc>The assistant detects an intent, then follows a join, waitlist, scored host intake or escalation path and returns structured output.</desc>
  <path class="arr" d="M260 66 L260 90 L69 90 L69 110"/>
  <path class="arr" d="M260 66 L260 90 L199 90 L199 110"/>
  <path class="arr" d="M260 66 L260 90 L329 90 L329 110"/>
  <path class="arr" d="M260 66 L260 90 L455 90 L455 110"/>
  <path class="arr" d="M69 156 L69 190"/>
  <path class="arr" d="M329 156 L329 190"/>
  <path class="arr" d="M329 236 L329 260"/>
  <path class="arr" d="M329 306 L329 330"/>
  <path class="arr" d="M329 376 L329 400"/>
  <path class="arr" d="M455 156 L455 190"/>
  <path class="arr" d="M258 133 L270 133"/>
  <rect class="box" x="110" y="20" width="300" height="46" rx="6"/>
  <text class="lbl" x="260" y="40" text-anchor="middle">Detect intent</text>
  <text class="sub" x="260" y="57" text-anchor="middle">A, B, C, F, human</text>
  <rect class="box" x="10" y="110" width="118" height="46" rx="6"/>
  <text class="lbl" x="69" y="130" text-anchor="middle">A Join</text>
  <text class="sub" x="69" y="147" text-anchor="middle">contact, region</text>
  <rect class="box" x="140" y="110" width="118" height="46" rx="6"/>
  <text class="lbl" x="199" y="130" text-anchor="middle">B Waitlist</text>
  <text class="sub" x="199" y="147" text-anchor="middle">offer hosting</text>
  <rect class="box" x="270" y="110" width="118" height="46" rx="6"/>
  <text class="lbl" x="329" y="130" text-anchor="middle">C Host</text>
  <text class="sub" x="329" y="147" text-anchor="middle">intake</text>
  <rect class="box" x="400" y="110" width="110" height="46" rx="6"/>
  <text class="lbl" x="455" y="130" text-anchor="middle">F Escalate</text>
  <text class="sub" x="455" y="147" text-anchor="middle">risk flags</text>
  <rect class="box" x="10" y="190" width="118" height="46" rx="6"/>
  <text class="lbl" x="69" y="210" text-anchor="middle">Wait</text>
  <text class="sub" x="69" y="227" text-anchor="middle">system command</text>
  <rect class="box" x="270" y="190" width="118" height="46" rx="6"/>
  <text class="lbl" x="329" y="210" text-anchor="middle">Gate</text>
  <text class="sub" x="329" y="227" text-anchor="middle">2 questions</text>
  <rect class="box" x="270" y="260" width="118" height="46" rx="6"/>
  <text class="lbl" x="329" y="280" text-anchor="middle">Score</text>
  <text class="sub" x="329" y="297" text-anchor="middle">9 questions</text>
  <rect class="box" x="270" y="330" width="118" height="46" rx="6"/>
  <text class="lbl" x="329" y="350" text-anchor="middle">Photos</text>
  <text class="sub" x="329" y="367" text-anchor="middle">3 to 5</text>
  <rect class="store" x="270" y="400" width="118" height="46" rx="6"/>
  <text class="lbl" x="329" y="420" text-anchor="middle">JSON</text>
  <text class="sub" x="329" y="437" text-anchor="middle">to Make</text>
  <rect class="box" x="400" y="190" width="110" height="46" rx="6"/>
  <text class="lbl" x="455" y="210" text-anchor="middle">Human</text>
  <text class="sub" x="455" y="227" text-anchor="middle">handoff</text>
</svg>
