<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410" role="img">
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2328"/></marker></defs>
<style>
.box{fill:#fff;stroke:#1f2328;stroke-width:1.2}
.store{fill:#fff;stroke:#0969da;stroke-width:1.6}
.lbl{fill:#1f2328;font:600 14px sans-serif}
.sub{fill:#57606a;font:13px sans-serif}
.arr{stroke:#1f2328;stroke-width:1.4;fill:none;marker-end:url(#head)}
</style>
<rect width="100%" height="100%" fill="#fff"/>

  <title>Duplicate check flow</title>
  <desc>A new registration triggers four lookups on a board, a count of matches, then a status update and notes on the old and new items.</desc>
  <path class="arr" d="M260 66 L260 90"/>
  <path class="arr" d="M260 136 L260 152 L69 152 L69 170"/>
  <path class="arr" d="M260 136 L260 152 L197 152 L197 170"/>
  <path class="arr" d="M260 136 L260 152 L325 152 L325 170"/>
  <path class="arr" d="M260 136 L260 152 L453 152 L453 170"/>
  <path class="arr" d="M69 216 L69 238 L260 238 L260 260"/>
  <path class="arr" d="M197 216 L197 238 L260 238 L260 260"/>
  <path class="arr" d="M325 216 L325 238 L260 238 L260 260"/>
  <path class="arr" d="M453 216 L453 238 L260 238 L260 260"/>
  <path class="arr" d="M260 306 L260 323 L135 323 L135 340"/>
  <path class="arr" d="M260 306 L260 323 L385 323 L385 340"/>
  <rect class="store" x="110" y="20" width="300" height="46" rx="6"/>
  <text class="lbl" x="260" y="40" text-anchor="middle">New registration</text>
  <text class="sub" x="260" y="57" text-anchor="middle">board webhook</text>
  <rect class="box" x="110" y="90" width="300" height="46" rx="6"/>
  <text class="lbl" x="260" y="110" text-anchor="middle">Wait 10 seconds</text>
  <text class="sub" x="260" y="127" text-anchor="middle">read item and phone</text>
  <rect class="box" x="10" y="170" width="118" height="46" rx="6"/>
  <text class="lbl" x="69" y="190" text-anchor="middle">Lookup 1</text>
  <text class="sub" x="69" y="207" text-anchor="middle">board query</text>
  <rect class="box" x="138" y="170" width="118" height="46" rx="6"/>
  <text class="lbl" x="197" y="190" text-anchor="middle">Lookup 2</text>
  <text class="sub" x="197" y="207" text-anchor="middle">board query</text>
  <rect class="box" x="266" y="170" width="118" height="46" rx="6"/>
  <text class="lbl" x="325" y="190" text-anchor="middle">Lookup 3</text>
  <text class="sub" x="325" y="207" text-anchor="middle">board query</text>
  <rect class="box" x="394" y="170" width="118" height="46" rx="6"/>
  <text class="lbl" x="453" y="190" text-anchor="middle">Lookup 4</text>
  <text class="sub" x="453" y="207" text-anchor="middle">board query</text>
  <rect class="box" x="110" y="260" width="300" height="46" rx="6"/>
  <text class="lbl" x="260" y="280" text-anchor="middle">Count matches</text>
  <text class="sub" x="260" y="297" text-anchor="middle">filter on count</text>
  <rect class="store" x="20" y="340" width="230" height="50" rx="6"/>
  <text class="lbl" x="135" y="362" text-anchor="middle">Update status</text>
  <text class="sub" x="135" y="379" text-anchor="middle">board item</text>
  <rect class="store" x="270" y="340" width="230" height="50" rx="6"/>
  <text class="lbl" x="385" y="362" text-anchor="middle">Add note</text>
  <text class="sub" x="385" y="379" text-anchor="middle">old and new item</text>
</svg>
