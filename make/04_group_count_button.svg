<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 446" role="img">
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2328"/></marker></defs>
<style>
.box{fill:#fff;stroke:#1f2328;stroke-width:1.2}
.store{fill:#fff;stroke:#0969da;stroke-width:1.6}
.lbl{fill:#1f2328;font:600 14px sans-serif}
.sub{fill:#57606a;font:13px sans-serif}
.arr{stroke:#1f2328;stroke-width:1.4;fill:none;marker-end:url(#head)}
</style>
<rect width="100%" height="100%" fill="#fff"/>

  <title>Participant count button flow</title>
  <desc>A button on a board starts a scenario that checks links, reads group members, counts them per category and writes the counts back.</desc>
  <path class="arr" d="M260 66 L220 92"/>
  <path class="arr" d="M220 138 L220 164"/>
  <path class="arr" d="M220 210 L260 236"/>
  <path class="arr" d="M260 282 L260 308"/>
  <path class="arr" d="M260 354 L260 380"/>
  <path class="arr" d="M330 115 L360 115"/>
  <path class="arr" d="M330 187 L360 187"/>
  <rect class="box" x="110" y="20" width="300" height="46" rx="6"/>
  <text class="lbl" x="260" y="40" text-anchor="middle">Button pressed</text>
  <text class="sub" x="260" y="57" text-anchor="middle">webhook from board</text>
  <rect class="store" x="110" y="92" width="220" height="46" rx="6"/>
  <text class="lbl" x="220" y="112" text-anchor="middle">Read item</text>
  <text class="sub" x="220" y="129" text-anchor="middle">group linked?</text>
  <rect class="store" x="110" y="164" width="220" height="46" rx="6"/>
  <text class="lbl" x="220" y="184" text-anchor="middle">Read host item</text>
  <text class="sub" x="220" y="201" text-anchor="middle">host linked?</text>
  <rect class="box" x="110" y="236" width="300" height="46" rx="6"/>
  <text class="lbl" x="260" y="256" text-anchor="middle">Read group items</text>
  <text class="sub" x="260" y="273" text-anchor="middle">one list per category</text>
  <rect class="box" x="110" y="308" width="300" height="46" rx="6"/>
  <text class="lbl" x="260" y="328" text-anchor="middle">Count per category</text>
  <text class="sub" x="260" y="345" text-anchor="middle">6 categories + none</text>
  <rect class="store" x="110" y="380" width="300" height="46" rx="6"/>
  <text class="lbl" x="260" y="400" text-anchor="middle">Write counts</text>
  <text class="sub" x="260" y="417" text-anchor="middle">group item</text>
  <rect class="box" x="360" y="92" width="150" height="46" rx="6"/>
  <text class="lbl" x="435" y="112" text-anchor="middle">No group</text>
  <text class="sub" x="435" y="129" text-anchor="middle">set status</text>
  <rect class="box" x="360" y="164" width="150" height="46" rx="6"/>
  <text class="lbl" x="435" y="184" text-anchor="middle">No host</text>
  <text class="sub" x="435" y="201" text-anchor="middle">set status</text>
</svg>
