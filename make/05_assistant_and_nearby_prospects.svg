<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 390" role="img">
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2328"/></marker></defs>
<style>
.box{fill:#fff;stroke:#1f2328;stroke-width:1.2}
.store{fill:#fff;stroke:#0969da;stroke-width:1.6}
.lbl{fill:#1f2328;font:600 14px sans-serif}
.sub{fill:#57606a;font:13px sans-serif}
.arr{stroke:#1f2328;stroke-width:1.4;fill:none;marker-end:url(#head)}
</style>
<rect width="100%" height="100%" fill="#fff"/>

  <title>Assistant callbacks and nearby prospects</title>
  <desc>Two flows. An assistant lead event looks up a board and replies. A new board item triggers a loop over prospects with a distance lookup and a message.</desc>
  <path class="arr" d="M127 66 L127 96"/>
  <path class="arr" d="M127 142 L127 172"/>
  <path class="arr" d="M127 218 L127 248"/>
  <path class="arr" d="M127 294 L127 324"/>
  <path class="arr" d="M392 66 L392 96"/>
  <path class="arr" d="M392 142 L392 172"/>
  <path class="arr" d="M392 218 L392 248"/>
  <path class="arr" d="M392 294 L392 324"/>
  <rect class="box" x="10" y="20" width="235" height="46" rx="6"/>
  <text class="lbl" x="127" y="40" text-anchor="middle">Assistant lead event</text>
  <text class="sub" x="127" y="57" text-anchor="middle">instant trigger</text>
  <rect class="box" x="10" y="96" width="235" height="46" rx="6"/>
  <text class="lbl" x="127" y="116" text-anchor="middle">Router</text>
  <text class="sub" x="127" y="133" text-anchor="middle">two routes</text>
  <rect class="store" x="10" y="172" width="235" height="46" rx="6"/>
  <text class="lbl" x="127" y="192" text-anchor="middle">Search board</text>
  <text class="sub" x="127" y="209" text-anchor="middle">by column value</text>
  <rect class="box" x="10" y="248" width="235" height="46" rx="6"/>
  <text class="lbl" x="127" y="268" text-anchor="middle">Reply via assistant</text>
  <text class="sub" x="127" y="285" text-anchor="middle">2 message variants</text>
  <rect class="box" x="10" y="324" width="235" height="46" rx="6"/>
  <text class="lbl" x="127" y="344" text-anchor="middle">Return response</text>
  <text class="sub" x="127" y="361" text-anchor="middle">webhook reply</text>
  <rect class="store" x="275" y="20" width="235" height="46" rx="6"/>
  <text class="lbl" x="392" y="40" text-anchor="middle">New board item</text>
  <text class="sub" x="392" y="57" text-anchor="middle">instant watch</text>
  <rect class="store" x="275" y="96" width="235" height="46" rx="6"/>
  <text class="lbl" x="392" y="116" text-anchor="middle">List board items</text>
  <text class="sub" x="392" y="133" text-anchor="middle">prospects</text>
  <rect class="box" x="275" y="172" width="235" height="46" rx="6"/>
  <text class="lbl" x="392" y="192" text-anchor="middle">Loop per prospect</text>
  <text class="sub" x="392" y="209" text-anchor="middle">iterator</text>
  <rect class="box" x="275" y="248" width="235" height="46" rx="6"/>
  <text class="lbl" x="392" y="268" text-anchor="middle">Distance lookup</text>
  <text class="sub" x="392" y="285" text-anchor="middle">maps API</text>
  <rect class="box" x="275" y="324" width="235" height="46" rx="6"/>
  <text class="lbl" x="392" y="344" text-anchor="middle">Message via assistant</text>
  <text class="sub" x="392" y="361" text-anchor="middle">send message</text>
</svg>
